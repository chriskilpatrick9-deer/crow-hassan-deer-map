#fsbtn{position:absolute;z-index:1100;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);color:var(--fg);font-size:20px;line-height:40px;text-align:center;padding:0;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.35)}
body.map-fs #hdr,body.map-fs #toggle,body.map-fs #leg,body.map-fs #ctl{display:none!important}
@media (min-width:641px){#leg .chev{display:none}}
@media (max-width:640px){
 #hdr{right:56px;padding:6px 10px}#hdr h1{font-size:14px}
 #toggle{display:block;position:absolute;z-index:1001;top:70px;left:10px;border:0;border-radius:8px;padding:8px 12px;background:var(--acc);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.4)}
 #ctl{top:112px;width:auto;right:10px;max-height:50%;display:none}
 #ctl.open{display:block}
 #leg{left:10px;right:10px;width:auto;bottom:16px;max-height:34%;overflow:auto}
 .badge{font-size:9.5px;padding:2px 5px}.badge b{font-size:10.5px}
 #leg.min .lrow{display:inline-block;margin-right:6px}#leg.min .lrow .sw{margin-right:2px}

</style></head><body>
<div id="map" role="application" aria-label="Deer activity map"></div>
<div id="hdr" class="panel"><h1>MBRB Hunt 10 · Crow-Hassan Park Reserve — Deer Activity</h1>
<div class="sub">Last updated <span id="upd"></span> · data saved <span id="snap"></span></div></div>
<button id="toggle" aria-expanded="false">☰ Layers &amp; filters</button>
<button id="fsbtn" type="button" aria-label="Toggle full screen" title="Full screen">⛶</button>
<div id="ctl" class="panel">
 <h3>Hunt day</h3><div class="dayrow"><select id="day"></select><select id="ap" aria-label="Session time" autocomplete="off"><option value="all">All</option><option value="AM">AM</option><option value="PM">PM</option></select></div>

 <h3>Zones</h3>
 <div class="zbtn"><button id="zAll" type="button">All</button><button id="zNone" type="button">None</button></div>
 <div id="zones" class="zgrid"></div>
 <h3>Shade zones by</h3>
 <div class="seg" id="metric"><button data-m="rate" class="on">Seen / 100 hrs</button><button data-m="seen">Raw sightings</button></div>
 <h3>Layers</h3>
 <label><input type="checkbox" id="lyChoro" checked> Zone shading</label>
 <label><input type="checkbox" id="lyHeat" checked autocomplete="off"> Heat (smoothed)</label>
 <label id="lyPinsW" style="display:none"><input type="checkbox" id="lyPins" checked autocomplete="off"> Hunter pins</label>
 <label><input type="checkbox" id="lyHv" checked> Zone labels &amp; harvests</label>
 <label><input type="checkbox" id="lyHvM" checked> Harvests</label>
 <label><input type="checkbox" id="lyPk" checked> Parking</label>
 <h3>Basemap</h3>
 <div class="seg" id="base"><button data-b="sat" class="on">Satellite</button><button data-b="osm">Street (OSM)</button></div>
</div>
<div id="leg" class="panel"></div>
